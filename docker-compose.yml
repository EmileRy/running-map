services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: running-map-db
    environment:
      POSTGRES_DB: running_map
      POSTGRES_USER: running_map
      POSTGRES_PASSWORD: running_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U running_map"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
